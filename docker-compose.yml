services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ai-service:
    build: ./ai-service
    restart: unless-stopped
    environment:
      APP_ENV: development
      MONGODB_URI: mongodb://mongo:27017/truthguard
      MONGODB_DB: truthguard
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:-local-dev-internal-token-24chars}
      MODEL_ARTIFACT_URL: ${MODEL_ARTIFACT_URL:-}
      MODEL_ARTIFACT_SHA256: ${MODEL_ARTIFACT_SHA256:-}
      RETRAIN_ENABLED: "false"
      # Local development has no trained artifact yet; results are labelled heuristic.
      ALLOW_HEURISTIC_FALLBACK: "true"
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.example
    environment:
      # The image defaults to prod, which requires https origins and full secrets.
      SPRING_PROFILES_ACTIVE: development
      MONGODB_URI: mongodb://mongo:27017/truthguard
      AI_SERVICE_BASE_URL: http://ai-service:8000
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:-local-dev-internal-token-24chars}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"
    depends_on:
      mongo:
        condition: service_healthy
      ai-service:
        condition: service_started

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8080
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-privacy@truthguard.ai}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mongo_data:
