services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  ai-service:
    build: ./ai-service
    env_file:
      - ./ai-service/.env.example
    environment:
      - MONGODB_URI=mongodb://mongo:27017/truthguard
    ports:
      - "8000:8000"
    depends_on:
      - mongo

  backend:
    build: ./backend
    env_file:
      - ./backend/.env.example
    environment:
      - MONGODB_URI=mongodb://mongo:27017/truthguard
      - AI_SERVICE_BASE_URL=http://ai-service:8000
      - CORS_ALLOWED_ORIGINS=http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      - mongo
      - ai-service

  frontend:
    build: ./frontend
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mongo_data:

