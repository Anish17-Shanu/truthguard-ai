server:
  port: ${PORT:8080}

spring:
  application:
    name: truthguard-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/truthguard}

app:
  jwt:
    secret: ${JWT_SECRET:VGhpc0lzQVNlY3VyZUJhc2U2NEpXVFNlY3JldEtleUZvclRydXRoR3VhcmRBSTEyMw==}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:7200}
  ai-service:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
    timeout-seconds: ${AI_SERVICE_TIMEOUT_SECONDS:90}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  rate-limit:
    max-requests-per-minute: ${RATE_LIMIT_MAX_REQUESTS_PER_MINUTE:120}
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    admin-name: ${BOOTSTRAP_ADMIN_NAME:TruthGuard Admin}

logging:
  level:
    root: INFO
    com.truthguard.backend: INFO
