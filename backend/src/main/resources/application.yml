server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful

spring:
  application:
    name: truthguard-backend
  config:
    import: optional:file:.env[.properties]
  lifecycle:
    timeout-per-shutdown-phase: 20s
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/truthguard}
      auto-index-creation: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
  ai-service:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
    timeout-seconds: ${AI_SERVICE_TIMEOUT_SECONDS:30}
    internal-token: ${AI_INTERNAL_TOKEN:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  rate-limit:
    max-requests-per-minute: ${RATE_LIMIT_MAX_REQUESTS_PER_MINUTE:120}
    max-analyses-per-minute: ${MAX_ANALYSES_PER_MINUTE:30}
    max-analyses-per-day: ${MAX_ANALYSES_PER_DAY:200}
  retention:
    analyses-days: ${ANALYSES_RETENTION_DAYS:0}
    audit-days: ${AUDIT_RETENTION_DAYS:180}
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    admin-name: ${BOOTSTRAP_ADMIN_NAME:TruthGuard Admin}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mongo:
      enabled: true

resilience4j:
  circuitbreaker:
    instances:
      aiService:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
  timelimiter:
    instances:
      aiService:
        timeout-duration: 35s

logging:
  level:
    root: INFO
    com.truthguard.backend: INFO
